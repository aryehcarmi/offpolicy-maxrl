[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "offpolicy-maxrl"
version = "0.1.0"
description = "Finite-group success normalization for stale Countdown responses"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.2.6"]

[project.optional-dependencies]
study = ["matplotlib==3.10.7", "pyarrow==26.0.1"]
model = ["torch==2.8.0", "transformers==4.57.1"]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
